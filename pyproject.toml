[project]
name = "exode-platform"
version = "0.1.0"
description = "Exode clone FastAPI backend MVP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.3",
    "boto3>=1.35.30",
    "bcrypt>=4.2.0",
    "celery[redis]>=5.4.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "google-auth>=2.35.0",
    "greenlet>=3.1.1",
    "httpx>=0.27.2",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.5.2",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "redis>=5.1.1",
    "sqlalchemy>=2.0.35",
    "stripe>=10.12.0",
    "uvicorn[standard]>=0.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
